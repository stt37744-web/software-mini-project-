<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Paradise - Rooms</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    header {
      background-color: #2c3e50;
      color: white;
      padding: 20px 0;
    }
    .container {
      width: 90%;
      max-width: 1200px;
      margin: 0 auto;
    }
    nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      justify-content: flex-end;
    }
    nav ul li {
      margin: 0 15px;
    }
    nav ul li a {
      color: white;
      text-decoration: none;
      font-weight: 500;
    }
    .rooms {
      padding: 50px 0;
      background-color: #f8f9fa;
    }

    .rooms h2 {
      text-align: center;
      margin-bottom: 40px;
      font-size: 2.5em;
      color: #2c3e50;
    }

    .room-gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    .room-item {
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      width: calc(33.333% - 20px);
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .room-item:hover {
      transform: translateY(-10px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    }

    .room-item img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-bottom: 2px solid #ddd;
    }

    .room-item p {
      padding: 15px;
      font-size: 1.2em;
      color: #333;
      margin: 0;
    }

    .deluxe-rooms {
      display: none;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    footer {
      background-color: #2c3e50;
      color: white;
      text-align: center;
      padding: 20px 0;
      margin-top: 50px;
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>Hotel Paradise</h1>
      <nav>
<ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="rooms.html">Rooms</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li id="login-link"><a href="login.html">Login</a></li>
          <li id="register-link"><a href="register.html">Register</a></li>
          <li id="auth-nav" style="display: none;"><span>Welcome, <span id="username-display"></span> | <a href="#" onclick="logout(); return false;">Logout</a></span></li>
        </ul>
      </nav>
    </div>
  </header>

  <section id="rooms" class="rooms">
    <div class="container">
      <h2>Our Rooms</h2>
      <div class="room-gallery">
        <a href="http://127.0.0.1:5500/abnit.html" class="room-item" id="deluxe-room">
          <img src="https://media.istockphoto.com/id/1390233984/photo/modern-luxury-bedroom.jpg?s=612x612&w=0&k=20&c=po91poqYoQTbHUpO1LD1HcxCFZVpRG-loAMWZT7YRe4=" alt="Deluxe Room">
          <p>Deluxe Room</p>
        </a>
        <a href="http://127.0.0.1:5500/suiterooms.html" class="room-item">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcStlt7fQJKTv4ItEn69ACnOt4gD4MCv36DJeA&s" alt="Suite Room">
          <p>Suite Room</p>
        </a>
        <a href="http://127.0.0.1:5500/familyroom.html" class="room-item">
          <img src="https://www.oppeinhome.com/upload/images/ueditor/20230830/guide-to-design-luxury-bedroom-2.webp" alt="Family Room">
          <p>Family Room</p>
        </a>
        <a href="dining-area.html" class="room-item">
          <img src="https://cdn-ijnhp.nitrocdn.com/pywIAllcUPgoWDXtkiXtBgvTOSromKIg/assets/images/optimized/rev-5794eaa/www.jaypeehotels.com/blog/wp-content/uploads/2024/09/Blog-6-scaled.jpg" alt="Dining Area">
          <p>Dining Area</p>
        </a>
        <a href="bar-area.html" class="room-item">
          <img src="https://media-cdn.tripadvisor.com/media/photo-s/0d/5c/79/6a/hotel-combermere.jpg" alt="Bar Area">
          <p>Bar Area</p>
        </a>
      </div>
      <div class="deluxe-rooms" id="deluxe-rooms-section">
        <h3>All Deluxe Rooms</h3>
        <div class="room-item">
          <img src="https://media.istockphoto.com/id/1390233984/photo/modern-luxury-bedroom.jpg?s=612x612&w=0&k=20&c=po91poqYoQTbHUpO1LD1HcxCFZVpRG-loAMWZT7YRe4=" alt="Deluxe Room 1">
          <p>Deluxe Room 1</p>
        </div>
        <div class="room-item">
          <img src="https://media.istockphoto.com/id/1390233984/photo/modern-luxury-bedroom.jpg?s=612x612&w=0&k=20&c=po91poqYoQTbHUpO1LD1HcxCFZVpRG-loAMWZT7YRe4=" alt="Deluxe Room 2">
          <p>Deluxe Room 2</p>
        </div>
        <div class="room-item">
          <img src="https://media.istockphoto.com/id/1390233984/photo/modern-luxury-bedroom.jpg?s=612x612&w=0&k=20&c=po91poqYoQTbHUpO1LD1HcxCFZVpRG-loAMWZT7YRe4=" alt="Deluxe Room 3">
          <p>Deluxe Room 3</p>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <div class="container">
      <p>&copy; 2025 Hotel Paradise. All rights reserved.</p>
    </div>
  </footer>

  <script>
    document.getElementById('deluxe-room').addEventListener('click', function(event) {
      event.preventDefault(); // Prevent default anchor behavior
      const deluxeRoomsSection = document.getElementById('deluxe-rooms-section');
      if (deluxeRoomsSection.style.display === 'none' || deluxeRoomsSection.style.display === '') {
        deluxeRoomsSection.style.display = 'flex';
      } else {
        deluxeRoomsSection.style.display = 'none';
      }
    });
  </script>
</body>
</html>

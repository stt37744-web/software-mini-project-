<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Paradise - Deluxe Rooms</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    header {
      background-color: #2c3e50;
      color: white;
      padding: 20px 0;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: 0 auto;
    }


    nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      justify-content: flex-end;
    }
    

    nav ul li {
      margin: 0 15px;
    }

    nav ul li a {
      color: white;
      text-decoration: none;
      font-weight: 500;
    }

    .deluxe-rooms {
      padding: 50px 0;
      background-color: #f8f9fa;
    }

    .deluxe-rooms h2 {
      text-align: center;
      margin-bottom: 40px;
      font-size: 2.5em;
      color: #2c3e50;
    }

    .room-gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    .room-item {
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      width: calc(33.333% - 20px);
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .room-item:hover {
      transform: translateY(-10px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    }

    .room-item img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-bottom: 2px solid #ddd;
    }

    .room-item p {
      padding: 15px;
      font-size: 1.2em;
      color: #333;
      margin: 0;
    }

    .room-item .price {
      font-size: 1.5em;
      color: #e74c3c;
      margin-top: 10px;
    }

    footer {
      background-color: #2c3e50;
      color: white;
      text-align: center;
      padding: 20px 0;
      margin-top: 50px;
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>Hotel Paradise</h1>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="rooms.html">Rooms</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section class="deluxe-rooms">
    <div class="container">
      <h2>Our Deluxe Rooms</h2>
      <div class="room-gallery">
        <div class="room-item">
          <img src="https://media.istockphoto.com/id/1390233984/photo/modern-luxury-bedroom.jpg?s=612x612&w=0&k=20&c=po91poqYoQTbHUpO1LD1HcxCFZVpRG-loAMWZT7YRe4=" alt="Deluxe Room 1">
          <p>Deluxe Room 1</p>
          <p class="price">₹10,000 per night</p>
        </div>
        <div class="room-item">
          <img src="https://media.istockphoto.com/id/1390233984/photo/modern-luxury-bedroom.jpg?s=612x612&w=0&k=20&c=po91poqYoQTbHUpO1LD1HcxCFZVpRG-loAMWZT7YRe4=" alt="Deluxe Room 2">
          <p>Deluxe Room 2</p>
          <p class="price">₹12,000 per night</p>
        </div>
        <div class="room-item">
          <img src="https://media.istockphoto.com/id/1390233984/photo/modern-luxury-bedroom.jpg?s=612x612&w=0&k=20&c=po91poqYoQTbHUpO1LD1HcxCFZVpRG-loAMWZT7YRe4=" alt="Deluxe Room 3">
          <p>Deluxe Room 3</p>
          <p class="price">₹11,500 per night</p>
        </div>
        <div class="room-item">
          <img src="https://media.istockphoto.com/id/1390233984/photo/modern-luxury-bedroom.jpg?s=612x612&w=0&k=20&c=po91poqYoQTbHUpO1LD1HcxCFZVpRG-loAMWZT7YRe4=" alt="Deluxe Room 4">
          <p>Deluxe Room 4</p>
          <p class="price">₹13,000 per night</p>
        </div>
        <div class="room-item">
          <img src="https://media.istockphoto.com/id/1390233984/photo/modern-luxury-bedroom.jpg?s=612x612&w=0&k=20&c=po91poqYoQTbHUpO1LD1HcxCFZVpRG-loAMWZT7YRe4=" alt="Deluxe Room 5">
          <p>Deluxe Room 5</p>
          <p class="price">₹14,000 per night</p>
        </div>
        <div class="room-item">
          <img src="https://media.istockphoto.com/id/1390233984/photo/modern-luxury-bedroom.jpg?s=612x612&w=0&k=20&c=po91poqYoQTbHUpO1LD1HcxCFZVpRG-loAMWZT7YRe4=" alt="Deluxe Room 6">
          <p>Deluxe Room 6</p>
          <p class="price">₹15,000 per night</p>
        </div>
      </div>
    </div>
  </section>

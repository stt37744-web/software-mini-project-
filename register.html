<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Hotel Paradise</title>
  <link rel="stylesheet" href="style.css">
</head> 
  
<body>
  <header>
    <div class="container">
      <h1>Hotel Paradise</h1>
      <nav>
        <ul>
          
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="rooms.html">Rooms</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li id="auth-nav" style="display: none;">
            <span>Welcome, <span id="username-display"></span> | <a href="#" onclick="logout()">Logout</a></span>
          </li>
          <li id="login-link"><a href="login.html">Login</a></li>
          <li id="register-link"><a href="register.html">Register</a></li>
        </ul>
        
      </nav>
    </div>
  </header>

  <section class="page-section" style="min-height: calc(100vh - 200px); display: flex; align-items: center; justify-content: center; padding: 20px;">
    <div class="container">
      <div style="max-width: 400px; width: 100%; margin: 0 auto;">
        <h2 style="text-align: center; font-family: 'Playfair Display', serif; color: #2c3e50;">Create new account</h2>
        <form id="registerForm" class="professional-form">
          <label for="regUsername">Username</label>
          <input type="text" id="regUsername" required>
          <span class="error"></span>

          <label for="regEmail">Email</label>
          <input type="email" id="regEmail" required>
          <span class="error"></span>

          <label for="regFullName">Full Name</label>
          <input type="text" id="regFullName" required>
          <span class="error"></span>

          <label for="regPhone">Phone Number</label>
          <input type="tel" id="regPhone" required>
          <span class="error"></span>

          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" required>
          <span class="error"></span>

          <label for="regConfirmPassword">Confirm Password</label>
          <input type="password" id="regConfirmPassword" required>
          <span class="error"></span>

          <button type="submit" class="btn">Register</button>
          <p style="text-align: center; margin-top: 20px;">
            Already have an account? <a href="login.html">Login here</a>
          </p>
        </form>
      </div>
    </div>
  </section>
  <footer style="position: relative;">
    <p>&copy; 2025 Hotel Paradise. All rights reserved.</p>
  </footer>
  <script src="script.js"></script>
  <script>
    updateNav();
    
    // Real-time validation
    addRealTimeValidation('regUsername', validateUsername, 'regUsername');
    addRealTimeValidation('regEmail', validateEmail, 'regEmail');
    addRealTimeValidation('regFullName', validateFullName, 'regFullName');
    addRealTimeValidation('regPhone', validatePhone, 'regPhone');
    addRealTimeValidation('regPassword', validatePassword, 'regPassword');
  
    document.getElementById('regConfirmPassword').addEventListener('input', function() {
      const password = document.getElementById('regPassword').value;
      const confirm = this.value;
      if (confirm && password !== confirm) {
        showFieldError('regConfirmPassword', 'Passwords do not match');
      } else {
        clearFieldError('regConfirmPassword');
      }
    });
    
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('regUsername').value;
      const fullName = document.getElementById('regFullName').value;
      const phone = document.getElementById('regPhone').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('regConfirmPassword').value;
      
      const result = validateRegister(username, fullName, phone, email, password, confirmPassword);
      if (!result.valid) {
        Object.entries(result.errors).forEach(([field, msg]) => {
          showFieldError(field, msg);
        });
        return;
      }
      
      // Register user
      const users = getUsers();
      users.push({username, fullName, phone, email, password}); // Demo: store plain pw (real: hash)
      saveUsers(users);
      
      alert('Registration successful! Please login.');
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
